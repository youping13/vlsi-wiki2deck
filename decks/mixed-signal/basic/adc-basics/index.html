 50 MHz) ≈ 28.5 fJ [c28]"], "result": "≈ 論文寫的 FoM 29 fJ/conversion-step [c26]", "notes": "自己算一次就知道 FoM 的每個數字從哪來。", "figure": "liu2010-fig15"}, {"id": "s9a", "layout": "diagram", "kicker": "A · 基本量", "title": "靜態誤差：DNL 與 INL", "figure": "m1-dnl-inl", "bullets": ["DNL：每一階實際寬度和理想 1 LSB 的差 [c49]", "INL：整條轉換曲線和理想直線的偏差 [c50]", "DNL 一路累加起來就是 INL [c53]"], "notes": "(a) 看單一階寬度；(b) 看整條線。下一頁的 offset、gain 是整條線的平移和斜率。"}, {"id": "s9b", "layout": "diagram", "kicker": "A · 基本量", "title": "靜態誤差：Offset 與 Gain", "figure": "m1-offset-gain", "bullets": ["Offset error：整條曲線平移，第一個轉態點偏掉 [c51]", "Gain error：扣掉 offset 後斜率不同，越靠滿刻度差越多 [c52]"], "notes": "這兩個可以用校正（減掉、乘回去）修；DNL/INL 是形狀問題，比較難修。"}, {"id": "s9", "layout": "causal", "kicker": "A · 基本量", "title": "靜態參數：INL 為什麼在中間跳", "figure": "liu2010-fig14", "chain": [{"tag": "動機", "items": ["電容失配讓某些碼特別寬或窄，要量 DNL/INL [c30]"]}, {"tag": "問題", "items": ["INL 在 0111111111 → 1000000000 跳 [c31]"]}, {"tag": "原因", "items": ["佈線寄生讓 MSB 電容大約 1 LSB；中間碼正是 MSB 翻轉 [c32]"]}, {"tag": "代價", "items": ["效能主要受這個固定的電容失配限制 [c33]"]}], "notes": "每顆晶片都有 → 不是隨機，是佈線。"}]}, "cards": {"c1": {"page": "mixed-signal/basic/sampling-aliasing", "title": "取樣與混疊（Sampling, Aliasing）", "sources": ["percy-ms-notes"], "text": "動機：ADC 只能處理離散時間的值，所以要先取樣。(src: percy-ms-notes)"}, "c2": {"page": "mixed-signal/basic/sampling-aliasing", "title": "取樣與混疊（Sampling, Aliasing）", "sources": ["percy-ms-notes"], "text": "問題：取樣會把頻譜每隔 fs 複製一次，頻率 m·fs + Δf 和 Δf 取樣後變成同一個序列。(src: percy-ms-notes)"}, "c3": {"page": "mixed-signal/basic/sampling-aliasing", "title": "取樣與混疊（Sampling, Aliasing）", "sources": ["percy-ms-notes"], "text": "結論：輸入頻寬必須限制在 fs/2 以內，否則高頻會折回低頻（推論，依 Nyquist）。"}, "c4": {"page": "mixed-signal/basic/sampling-aliasing", "title": "取樣與混疊（Sampling, Aliasing）", "sources": ["percy-ms-notes"], "text": "頻域：$X_s(f) = \\frac{1}{T_s}\\sum_{k=-\\infty}^{\\infty} X(f-kf_s)$，把原頻譜每隔 fs 複製一次。(src: percy-ms-notes)"}, "c5": {"page": "mixed-signal/basic/sampling-aliasing", "title": "取樣與混疊（Sampling, Aliasing）", "sources": ["percy-ms-notes"], "text": "混疊推導：$x[n] = \\cos\\!\\left(2\\pi\\frac{mf_s+\\Delta f}{f_s}n\\right) = \\cos(2\\pi mn \\pm 2\\pi\\frac{\\Delta f}{f_s}n) = \\cos\\!\\left(2\\pi\\frac{\\Delta f}{f_s}n\\right)$ (src: percy-ms-notes)"}, "c6": {"page": "mixed-signal/basic/sampling-aliasing", "title": "取樣與混疊（Sampling, Aliasing）", "sources": ["percy-ms-notes"], "text": "2πmn 是 2π 的整數倍，所以可以消掉。(src: percy-ms-notes)"}, "c8": {"page": "mixed-signal/basic/quantization-noise-snr", "title": "量化雜訊與 SNR（Quantization Noise, SNR = 6.02N + 1.76）", "sources": ["percy-ms-notes"], "text": "動機：要知道一顆 N 位元 ADC 理論上最好能多乾淨。(src: percy-ms-notes)"}, "c9": {"page": "mixed-signal/basic/quantization-noise-snr", "title": "量化雜訊與 SNR（Quantization Noise, SNR = 6.02N + 1.76）", "sources": ["percy-ms-notes"], "text": "問題：量化誤差在 ±½Q 之間，是實務上一定存在的雜訊。(src: percy-ms-notes)"}, "c10": {"page": "mixed-signal/basic/quantization-noise-snr", "title": "量化雜訊與 SNR（Quantization Noise, SNR = 6.02N + 1.76）", "sources": ["percy-ms-notes"], "text": "結果：SNR = 6.02 × N + 1.76 是理想最大值，不考慮其它 non-ideal。(src: percy-ms-notes)"}, "c11": {"page": "mixed-signal/basic/quantization-noise-snr", "title": "量化雜訊與 SNR（Quantization Noise, SNR = 6.02N + 1.76）", "sources": ["percy-ms-notes"], "text": "代價／陷阱：訊號沒滿 code 時，訊號↓、相對雜訊↑、SNR↓。(src: percy-ms-notes)"}, "c12": {"page": "mixed-signal/basic/quantization-noise-snr", "title": "量化雜訊與 SNR（Quantization Noise, SNR = 6.02N + 1.76）", "sources": ["percy-ms-notes"], "text": "量化雜訊 RMS = LSB/√12 (src: percy-ms-notes)"}, "c13": {"page": "mixed-signal/basic/quantization-noise-snr", "title": "量化雜訊與 SNR（Quantization Noise, SNR = 6.02N + 1.76）", "sources": ["percy-ms-notes"], "text": "算例條件：10 bits、VDD = 1.2 V；A：Vsig 0~1.2 V；B：Vsig 0.3~0.9 V (src: percy-ms-notes)"}, "c14": {"page": "mixed-signal/basic/quantization-noise-snr", "title": "量化雜訊與 SNR（Quantization Noise, SNR = 6.02N + 1.76）", "sources": ["percy-ms-notes"], "text": "LSB = 1.2/1024 = 1.17 mV；量化雜訊 RMS = LSB/√12 = 0.34 mV (src: percy-ms-notes)"}, "c15": {"page": "mixed-signal/basic/quantization-noise-snr", "title": "量化雜訊與 SNR（Quantization Noise, SNR = 6.02N + 1.76）", "sources": ["percy-ms-notes"], "text": "A：振幅 0.6 V、訊號 RMS 0.424 V；SNR = 0.424 / (0.34×10⁻³) = 1247 = 61.9 dB = 6.02×10 + 1.76 (src: percy-ms-notes)"}, "c16": {"page": "mixed-signal/basic/quantization-noise-snr", "title": "量化雜訊與 SNR（Quantization Noise, SNR = 6.02N + 1.76）", "sources": ["percy-ms-notes"], "text": "B：振幅 0.3 V、訊號 RMS 0.212 V；用 ② SNR = P_signal / P_noise 直接算出 55.9 dB (src: percy-ms-notes)"}, "c17": {"page": "mixed-signal/basic/quantization-noise-snr", "title": "量化雜訊與 SNR（Quantization Noise, SNR = 6.02N + 1.76）", "sources": ["percy-ms-notes"], "text": "0.6 / 1.17m = 512 → 等效 9 bits ADC (src: percy-ms-notes)"}, "c18": {"page": "mixed-signal/basic/quantization-noise-snr", "title": "量化雜訊與 SNR（Quantization Noise, SNR = 6.02N + 1.76）", "sources": ["percy-ms-notes"], "text": "擺幅減半 ⇒ SNR 掉 6.02 dB ⇒ 等於少 1 bit：這是「訊號沒滿 code」最直觀的代價。(src: percy-ms-notes)"}, "c20": {"page": "mixed-signal/basic/adc-dynamic-parameters", "title": "ADC 動態參數（SNR、THD、SFDR、SNDR、ENOB、dBc/dBFS、FoM）", "sources": ["percy-meeting1"], "text": "$\\mathrm{SNR(dB)} = 10\\log_{10}\\frac{P_{signal}}{P_{noise}}$ (src: percy-meeting1)"}, "c21": {"page": "mixed-signal/basic/adc-dynamic-parameters", "title": "ADC 動態參數（SNR、THD、SFDR、SNDR、ENOB、dBc/dBFS、FoM）", "sources": ["percy-meeting1"], "text": "$\\mathrm{THD(dB)} = 10\\log_{10}\\frac{P_{harmonics}}{P_{signal}}$ (src: percy-meeting1)"}, "c22": {"page": "mixed-signal/basic/adc-dynamic-parameters", "title": "ADC 動態參數（SNR、THD、SFDR、SNDR、ENOB、dBc/dBFS、FoM）", "sources": ["percy-meeting1"], "text": "$\\mathrm{SFDR(dBc)} = 10\\log_{10}\\frac{P_{signal}}{P_{max\\_spur}}$ (src: percy-meeting1)"}, "c23": {"page": "mixed-signal/basic/adc-dynamic-parameters", "title": "ADC 動態參數（SNR、THD、SFDR、SNDR、ENOB、dBc/dBFS、FoM）", "sources": ["percy-meeting1"], "text": "$\\mathrm{SNDR(dB)} = 10\\log_{10}\\frac{P_{signal}}{P_{noise}+P_{harmonics}}$ (src: percy-meeting1)"}, "c24": {"page": "mixed-signal/basic/adc-dynamic-parameters", "title": "ADC 動態參數（SNR、THD、SFDR、SNDR、ENOB、dBc/dBFS、FoM）", "sources": ["percy-meeting1"], "text": "$\\mathrm{ENOB(bits)} = \\frac{\\mathrm{SNDR}-1.76}{6.02}$ (src: percy-meeting1)"}, "c25": {"page": "mixed-signal/basic/adc-dynamic-parameters", "title": "ADC 動態參數（SNR、THD、SFDR、SNDR、ENOB、dBc/dBFS、FoM）", "sources": ["percy-meeting1"], "text": "$\\mathrm{FOM} = \\frac{\\mathrm{Power}}{2^{\\mathrm{ENOB}}\\times \\min\\{2\\times \\mathrm{ERBW},\\, f_s\\}}$ (src: percy-meeting1)"}, "c26": {"page": "mixed-signal/basic/adc-dynamic-parameters", "title": "ADC 動態參數（SNR、THD、SFDR、SNDR、ENOB、dBc/dBFS、FoM）", "sources": ["liu-2010-monotonic"], "text": "Liu 2010 實測：低頻 SNDR 57.0 dB、ENOB 9.18 bits、FoM 29 fJ/conversion-step、50 MS/s、0.826 mW (src: liu-2010-monotonic)"}, "c27": {"page": "mixed-signal/basic/adc-dynamic-parameters", "title": "ADC 動態參數（SNR、THD、SFDR、SNDR、ENOB、dBc/dBFS、FoM）", "sources": ["自己算（docs/calc-check.py）"], "text": "驗算 ENOB：(57.0 − 1.76)/6.02 = 9.18 bits（計算）"}, "c28": {"page": "mixed-signal/basic/adc-dynamic-parameters", "title": "ADC 動態參數（SNR、THD、SFDR、SNDR、ENOB、dBc/dBFS、FoM）", "sources": ["自己算（docs/calc-check.py）"], "text": "驗算 FoM：2^9.18 ≈ 580；0.826 mW / (580 × 50 MHz) ≈ 28.5 fJ，四捨五入就是論文的 29 fJ（計算）"}, "c30": {"page": "mixed-signal/basic/adc-static-parameters", "title": "ADC 靜態參數（LSB、DNL、INL、Gain/Offset Error）", "sources": ["percy-meeting1"], "text": "動機：電容失配會讓某些碼特別寬或特別窄，要量出來。(src: percy-meeting1)"}, "c31": {"page": "mixed-signal/basic/adc-static-parameters", "title": "ADC 靜態參數（LSB、DNL、INL、Gain/Offset Error）", "sources": ["percy-meeting1"], "text": "問題：Liu 的晶片 INL 在中間碼 0111111111 → 1000000000 跳動。(src: percy-meeting1)"}, "c32": {"page": "mixed-signal/basic/adc-static-parameters", "title": "ADC 靜態參數（LSB、DNL、INL、Gain/Offset Error）", "sources": ["liu-2010-monotonic"], "text": "原因：佈線寄生讓 MSB 電容大了約 1 LSB；中間碼正是 MSB 翻轉的位置。(src: liu-2010-monotonic)"}, "c33": {"page": "mixed-signal/basic/adc-static-parameters", "title": "ADC 靜態參數（LSB、DNL、INL、Gain/Offset Error）", "sources": ["liu-2010-monotonic"], "text": "代價：效能主要受這個固定的電容失配限制。(src: liu-2010-monotonic)"}, "c48": {"page": "mixed-signal/basic/quantization-noise-snr", "title": "量化雜訊與 SNR（Quantization Noise, SNR = 6.02N + 1.76）", "sources": ["percy-ms-notes"], "text": "B 旁註：61.9 − 6.02 = 6.02×9 + 1.76，訊號少半 (src: percy-ms-notes)"}, "c49": {"page": "mixed-signal/basic/adc-static-parameters", "title": "ADC 靜態參數（LSB、DNL、INL、Gain/Offset Error）", "sources": ["percy-meeting1"], "text": "DNL：每一階實際寬度和理想 1 LSB 的差；看的是「單一階」對不對。(src: percy-meeting1)"}, "c50": {"page": "mixed-signal/basic/adc-static-parameters", "title": "ADC 靜態參數（LSB、DNL、INL、Gain/Offset Error）", "sources": ["percy-meeting1"], "text": "INL：實際轉換曲線和理想直線的偏差。(src: percy-meeting1)"}, "c51": {"page": "mixed-signal/basic/adc-static-parameters", "title": "ADC 靜態參數（LSB、DNL、INL、Gain/Offset Error）", "sources": ["percy-meeting1"], "text": "Offset error：整條轉換曲線平移，第一個轉態點偏離理想位置。(src: percy-meeting1)"}, "c52": {"page": "mixed-signal/basic/adc-static-parameters", "title": "ADC 靜態參數（LSB、DNL、INL、Gain/Offset Error）", "sources": ["percy-meeting1"], "text": "Gain error：扣掉 offset 之後，曲線斜率和理想不同，越靠滿刻度差越多。(src: percy-meeting1)"}, "c53": {"page": "mixed-signal/basic/adc-static-parameters", "title": "ADC 靜態參數（LSB、DNL、INL、Gain/Offset Error）", "sources": ["percy-meeting1"], "text": "DNL 一路累加起來就是 INL（推論）"}, "c54": {"page": "mixed-signal/basic/adc-dynamic-parameters", "title": "ADC 動態參數（SNR、THD、SFDR、SNDR、ENOB、dBc/dBFS、FoM）", "sources": ["percy-meeting1"], "text": "dBc 是相對載波（輸入訊號），dBFS 是相對滿刻度。(src: percy-meeting1)"}, "c55": {"page": "mixed-signal/basic/adc-dynamic-parameters", "title": "ADC 動態參數（SNR、THD、SFDR、SNDR、ENOB、dBc/dBFS、FoM）", "sources": ["percy-meeting1"], "text": "dBc 和 dBFS 差的就是「輸入離滿刻度多遠」，比較兩份 SFDR 要先確認單位。(src: percy-meeting1)"}}, "figures": {"m1-fft-params": {"src": "../../../../assets/figures/m1-fft-params.png", "label": "meeting 1 p45", "desc": "頻譜上的 FS、輸入訊號、最大 spur：SFDR(dBc) vs SFDR(dBFS)", "cite": "知乎（圖上浮水印；meeting 1 參考資料 p/575589874）"}, "liu2010-fig15": {"src": "../../../../assets/figures/liu2010-fig15.png", "label": "Fig. 15", "desc": "實測 FFT 頻譜：輸入 10 MHz、取樣 50 MS/s", "cite": "Chun-Cheng Liu et al., IEEE JSSC, vol. 45, no. 4, pp. 731–740, April 2010"}, "m1-dnl-inl": {"src": "../../../../assets/figures/m1-dnl-inl.png", "label": "meeting 1 p78", "desc": "(a) DNL：每階寬度和 1 LSB 的差 (b) INL：和理想曲線的偏差", "cite": "meeting 1 參考資料：https://blog.csdn.net/qlexcel/article/details/144568435 、https://zhuanlan.zhihu.com/p/575589874"}, "m1-offset-gain": {"src": "../../../../assets/figures/m1-offset-gain.png", "label": "meeting 1 p79", "desc": "(a) offset error：整條平移 (b) gain error：斜率不同", "cite": "meeting 1 參考資料：https://blog.csdn.net/qlexcel/article/details/144568435 、https://zhuanlan.zhihu.com/p/575589874"}, "liu2010-fig14": {"src": "../../../../assets/figures/liu2010-fig14.png", "label": "Fig. 14", "desc": "量測 DNL / INL，INL 在中間碼有跳動", "cite": "Chun-Cheng Liu et al., IEEE JSSC, vol. 45, no. 4, pp. 731–740, April 2010"}}};
(function(){
  const deck = DATA.deck, cards = DATA.cards, figures = DATA.figures || {}, stage = document.getElementById('stage');
  function paper(id, cls){
    const f = figures[id]; if (!f) return '';

      <figcaption><b>${esc(f.label)}</b>　${esc(f.desc)}<span class="src">圖源：${esc(f.cite)}${/Percy/.test(f.cite)?'':'，© 原作者，僅供教學引用'}</span></figcaption></figure>`;
  }
  const wikiBase = deck.wiki_base || '../../wiki/';

      used.add(id); return `<span class="cite" data-card="${id}">${id}</span>`;
    }).join(''));
  }
  function list2(items, used){ return `<ul>${(items||[]).map(t => `<li>${rich(t, used)}</li>`).join('')}</ul>`; }
  function list(items, used){ return `<ul class="pts">${(items||[]).map(t => `<li>${rich(t, used)}</li>`).join('')}</ul>`; }
  function head(s){
    const k = s.kicker ? `<div class="kicker">${esc(s.kicker)}</div>` : '';

    return `${k}<h1 class="title">${esc(s.title)}${en}</h1>`;
  }
  function refs(used){

      const c = cards[id]; if(!c) return '';
      return `<a class="ref" data-card="${id}" href="${wikiBase}${c.page}.md" target="_blank"><b>${id}</b> ${esc(c.page.split('/').pop())} ← ${esc(c.sources.join(', '))}</a>`;
    }).join('');
  }
  const slides = deck.slides.map((s, i) => {
    const used = new Set(); let inner = '';

    if (L === 'title') {
      inner = `<div class="bar"></div>${s.kicker?`<div class="kicker">${esc(s.kicker)}</div>`:''}<h1>${esc(s.title)}</h1>
        ${s.subtitle?`<div class="sub">${esc(s.subtitle)}</div>`:''}<div class="meta">${esc(deck.author||'')}${deck.date?' · '+esc(deck.date):''}</div>`;
    } else if (L === 'two-col') {
      inner = head(s) + `<div class="body"><div class="col"><h3>${esc(s.left_title||'')}</h3>${list(s.left, used)}</div>

    } else if (L === 'diagram') {

      inner = head(s) + `<div class="body"><div class="col" style="flex:${s.figure?'.62':'.85'}">${list(s.bullets, used)}</div>${visual}</div>`;
    } else if (L === 'causal') {
      const TAG = {'動機':'t-motive','問題':'t-problem','為什麼':'t-why','解法':'t-solution','代價':'t-cost','優缺點':'t-cost','結果':'t-solution','原因':'t-why'};
      const visual = s.figure ? paper(s.figure) : (s.svg ? `<div class="fig">${s.svg}</div>` : '');
      const chain = `<div class="chain ${visual ? 'v' : 'h'}">${(s.chain||[]).map(c => `<div class="step ${TAG[c.tag]||'t-why'}"><div class="tag">${esc(c.tag)}</div>${list2(c.items, used)}</div>`).join('')}</div>`;
      inner = head(s) + (visual ? `<div class="body"><div class="col" style="flex:${s.figure?'.8':'1.05'}">${chain}</div>${visual}</div>` : `<div class="body">${chain}</div>`);

    } else if (L === 'calc') {

  // navigation

  }
  function fit(){
    if (document.body.classList.contains('overview')) return;
    const k = Math.min(innerWidth/1280, innerHeight/720) * .96;
    stage.style.transform = `scale(${k})`;
  }
  addEventListener('resize', fit);
  addEventListener('keydown', e => {
    if (['ArrowRight','PageDown',' ','Enter'].includes(e.key)) { show(cur+1); e.preventDefault(); }
    else if (['ArrowLeft','PageUp','Backspace'].includes(e.key)) { show(cur-1); e.preventDefault(); }
    else if (e.key==='Home') show(0); else if (e.key==='End') show(slides.length-1);
    else if (e.key==='n'||e.key==='N') notes.classList.toggle('show');
    else if (e.key==='o'||e.key==='O') { document.body.classList.toggle('overview'); fit(); if(!document.body.classList.contains('overview')) fit(); }
    else if (e.key==='p'||e.key==='P') print();
  });
  stage.addEventListener('click', e => {
    if (document.body.classList.contains('overview')) {
      const s = e.target.closest('.slide'); if (s) { document.body.classList.remove('overview'); show(+s.dataset.i); fit(); }
      return;
    }
    const im = e.target.closest('.paper img');
    if (im) { zoom.querySelector('img').src = im.src; zoom.classList.add('show'); return; }
    if (e.target.closest('button,a,.cite')) return;
    show(e.clientX > innerWidth/3 ? cur+1 : cur-1);
  });
  const zoom = document.getElementById('zoom');
  zoom.onclick = () => zoom.classList.remove('show');
  addEventListener('keydown', e => { if (e.key === 'Escape') zoom.classList.remove('show'); }, true);
  let tx = null;
  addEventListener('touchstart', e => tx = e.touches[0].clientX, {passive:true});
  addEventListener('touchend', e => { if (tx===null) return; const d = e.changedTouches[0].clientX - tx; if (Math.abs(d)>40) show(cur + (d<0?1:-1)); tx=null; });
  // citation tooltip: 顯示 wiki 原文證據
  const tip = document.getElementById('tip');
  document.addEventListener('mouseover', e => {
    const t = e.target.closest('[data-card]'); if (!t) return;
    const c = cards[t.dataset.card]; if (!c) return;
    tip.innerHTML = `<small>${t.dataset.card} · wiki/${esc(c.page)}</small>${esc(c.text)}`;
    tip.style.display = 'block';
  });
  document.addEventListener('mousemove', e => { tip.style.left = Math.min(e.clientX+14, innerWidth-480)+'px'; tip.style.top = Math.max(e.clientY-14-tip.offsetHeight, 8)+'px'; });
  document.addEventListener('mouseout', e => { if (e.target.closest('[data-card]')) tip.style.display = 'none'; });
  document.getElementById('prev').onclick = () => show(cur-1);
  document.getElementById('next').onclick = () => show(cur+1);
  // ⌂：回這份簡報所在的分類頁；如果就是從那頁點進來的，用 back() 保留原本捲動位置
  const homeA = document.getElementById('home');
  if (deck.home) homeA.href = deck.home;
  function goHome(e){
    const target = new URL(homeA.href, location.href);
    let ref = null; try { ref = document.referrer && new URL(document.referrer); } catch(_){}
    if (ref && ref.pathname === target.pathname && history.length > 1) { if (e) e.preventDefault(); history.back(); }
    else location.href = homeA.href;
  }
  homeA.addEventListener('click', e => { e.preventDefault(); goHome(); });
  addEventListener('keydown', e => { if (e.key === 'h' || e.key === 'H') goHome(); });
  fit(); show(cur);
  // LaTeX：$…$ 行內、$$…$$ 置中（KaTeX，檔案在 template/vendor/katex，離線可用）
  addEventListener('load', () => { if (window.renderMathInElement) renderMathInElement(stage, {
    delimiters: [{left:'$$', right:'$$', display:true}, {left:'$', right:'$', display:false}], throwOnError:false }); });
})();
</script>
</body>
</html>
