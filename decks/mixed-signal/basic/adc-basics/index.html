.kicker{font-size:15px;letter-spacing:.18em;color:var(--accent);font-weight:700;text-transform:uppercase;margin-bottom:10px}
h1.title{font-size:44px;line-height:1.25;font-weight:800;margin-bottom:28px;max-width:1050px}

.col{flex:1;min-width:0;display:flex;flex-direction:column}

ul.pts li{font-size:26px;line-height:1.5;padding-left:34px;position:relative}
ul.pts li::before{content:"";position:absolute;left:4px;top:.62em;width:12px;height:12px;border-radius:3px;background:var(--accent);transform:rotate(45deg)}
.col h3{font-size:22px;color:var(--accent-2);margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid var(--blue-soft)}
.col ul.pts li{font-size:23px}
.cite{display:inline-block;font-size:.55em;vertical-align:super;color:var(--accent-2);font-family:var(--mono);margin-left:3px;cursor:help;font-weight:600}
.fig{flex:1.15;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}

.refs{display:flex;flex-wrap:wrap;gap:6px;max-width:960px}

.ref b{color:var(--accent-2)}
.pageno{font-family:var(--mono)}
/* 論文原圖 */
.paper{flex:1.2;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px 10px;min-height:0}
.paper .imgwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.paper img{max-width:100%;max-height:100%;object-fit:contain}
.paper figcaption{font-size:13px;line-height:1.45;color:var(--ink-2);margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.paper figcaption b{color:var(--accent)}
.paper figcaption .src{display:block;color:var(--muted);font-family:var(--mono);font-size:11.5px}
.katex{font-size:1.02em}
.q .katex,.explain .katex{font-size:1em}
/* causal：動機 → 問題 → 解法 → 代價 */
.chain{display:flex;gap:14px;align-items:stretch;flex:1;min-height:0}
.chain.h{align-items:center;padding-bottom:30px}
.chain.h .step{flex:1;min-height:200px;justify-content:flex-start}
.chain.h .step li{font-size:23px}
.chain.h .step .tag{font-size:17px}
.chain.v{flex-direction:column;gap:10px}
.step{position:relative;background:#fff;border:1px solid var(--line);border-top:5px solid var(--c);border-radius:12px;padding:12px 16px 14px;display:flex;flex-direction:column}
.chain.v .step{flex-direction:row;align-items:flex-start;gap:14px;border-top:1px solid var(--line);border-left:6px solid var(--c);padding:10px 14px}
.step .tag{font-size:15px;font-weight:800;color:var(--c);letter-spacing:.08em;margin-bottom:8px;white-space:nowrap}
.chain.v .step .tag{min-width:64px;margin:3px 0 0}
.step ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.step li{font-size:20px;line-height:1.45}
.chain.v .step li{font-size:19px}
.chain.h .step:not(:last-child)::after{content:"→";position:absolute;right:-16px;top:42%;font-size:22px;color:var(--muted);z-index:2}
.t-motive{--c:#2f6f8f}.t-problem{--c:#c2413b}.t-why{--c:#8b5cf6}.t-solution{--c:#2f8f5b}.t-cost{--c:#d9622b}

.opt.wrong{border-color:var(--bad);background:#fbe8e7}

.slide.l-summary ul.pts li::before{content:"✓";background:none;transform:none;color:var(--ok);font-weight:800;top:0;left:0;width:auto;height:auto;font-size:26px}

, "items": ["$X_s(f)=\\dfrac{1}{T_s}\\sum_k X(f-kf_s)$：頻譜每隔 fs 複製 [c4]", "m·fs + Δf 和 Δf 取樣後是同一個序列 [c2]"]}, {"tag": "結果", "items": ["輸入頻寬必須限制在 fs/2 以內 [c3]"]}], "notes": "時域乘脈衝串 = 頻域和脈衝串卷積 → 複製。"}, {"id": "s4", "layout": "calc", "kicker": "A · 基本量", "title": "混疊推導：m·fs + Δf 為什麼等於 Δf", "given": ["取一個頻率為 $mf_s+\\Delta f$ 的 cosine [c5]", "取樣時間 $t=nT_s=\\dfrac{n}{f_s}$ [c5]"], "steps": ["$x[n]=\\cos\\!\\left(2\\pi\\dfrac{mf_s+\\Delta f}{f_s}n\\right)$ [c5]", "$=\\cos\\!\\left(2\\pi mn \\pm 2\\pi\\dfrac{\\Delta f}{f_s}n\\right)$ [c5]", "$2\\pi mn$ 是 $2\\pi$ 的整數倍，消掉 [c6]", "$=\\cos\\!\\left(2\\pi\\dfrac{\\Delta f}{f_s}n\\right)$ [c5]"], "result": "取樣後分不出原頻率 → 頻寬限在 fs/2 以內 [c3]", "notes": "整個推導只用到 cos 的週期性。"}, {"id": "s5", "layout": "causal", "kicker": "A · 基本量", "title": "量化雜訊：SNR 的天花板", "svg": "<svg viewBox='0 0 600 400' xmlns='http://www.w3.org/2000/svg' font-family='Noto Sans TC,Noto Sans CJK TC,Microsoft JhengHei,sans-serif'><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1d2433'/><\/marker><\/defs><text x='20' y='40' font-size='19' font-weight='700' fill='#1d2433'>量化誤差：鋸齒，介於 ±½Q<\/text><line x1='40' y1='210' x2='570' y2='210' stroke='#8a93a6'/><line x1='40' y1='150' x2='570' y2='150' stroke='#c2413b' stroke-dasharray='5 4'/><line x1='40' y1='270' x2='570' y2='270' stroke='#c2413b' stroke-dasharray='5 4'/><text x='575' y='155' font-size='16' text-anchor='end' fill='#c2413b'>+½Q<\/text><text x='575' y='290' font-size='16' text-anchor='end' fill='#c2413b'>−½Q<\/text><line x1='40' y1='270' x2='105' y2='150' stroke='#2f6f8f' stroke-width='2.5'/><line x1='105' y1='150' x2='105' y2='270' stroke='#2f6f8f' stroke-width='1' stroke-dasharray='3 3'/><line x1='105' y1='270' x2='170' y2='150' stroke='#2f6f8f' stroke-width='2.5'/><line x1='170' y1='150' x2='170' y2='270' stroke='#2f6f8f' stroke-width='1' stroke-dasharray='3 3'/><line x1='170' y1='270' x2='235' y2='150' stroke='#2f6f8f' stroke-width='2.5'/><line x1='235' y1='150' x2='235' y2='270' stroke='#2f6f8f' stroke-width='1' stroke-dasharray='3 3'/><line x1='235' y1='270' x2='300' y2='150' stroke='#2f6f8f' stroke-width='2.5'/><line x1='300' y1='150' x2='300' y2='270' stroke='#2f6f8f' stroke-width='1' stroke-dasharray='3 3'/><line x1='300' y1='270' x2='365' y2='150' stroke='#2f6f8f' stroke-width='2.5'/><line x1='365' y1='150' x2='365' y2='270' stroke='#2f6f8f' stroke-width='1' stroke-dasharray='3 3'/><line x1='365' y1='270' x2='430' y2='150' stroke='#2f6f8f' stroke-width='2.5'/><line x1='430' y1='150' x2='430' y2='270' stroke='#2f6f8f' stroke-width='1' stroke-dasharray='3 3'/><line x1='430' y1='270' x2='495' y2='150' stroke='#2f6f8f' stroke-width='2.5'/><line x1='495' y1='150' x2='495' y2='270' stroke='#2f6f8f' stroke-width='1' stroke-dasharray='3 3'/><line x1='495' y1='270' x2='560' y2='150' stroke='#2f6f8f' stroke-width='2.5'/><line x1='560' y1='150' x2='560' y2='270' stroke='#2f6f8f' stroke-width='1' stroke-dasharray='3 3'/><text x='40' y='340' font-size='18' fill='#1d2433'>RMS = LSB/√12 → 與訊號無關的白雜訊<\/text><text x='590' y='392' font-size='13' text-anchor='end' fill='#8a93a6'>示意圖（自己畫）<\/text><\/svg>", "chain": [{"tag": "動機", "items": ["想知道 N 位元 ADC 理論上最好多乾淨 [c8]"]}, {"tag": "問題", "items": ["量化誤差在 ±½Q 之間，一定存在 [c9]", "RMS = LSB/√12 [c12]"]}, {"tag": "結果", "items": ["$SNR = 6.02N + 1.76$ 是理想最大值 [c10]"]}, {"tag": "代價", "items": ["訊號沒滿 code：訊號↓、相對雜訊↑、SNR↓ [c11]"]}], "notes": "6.02N + 1.76 是上限，不是實測值；實測看 SNDR。"}, {"id": "s6", "layout": "calc", "kicker": "A · 基本量", "title": "算例：沒滿 code，SNR 掉多少", "given": ["10 bits、VDD = 1.2 V [c13]", "A：Vsig 0~1.2 V；B：Vsig 0.3~0.9 V [c13]"], "steps": ["LSB = 1.2/1024 = 1.17 mV；RMS = LSB/√12 = 0.34 mV [c14]", "A：訊號 RMS 0.424 V → $\\dfrac{0.424}{0.34\\times10^{-3}}=1247$ = 61.9 dB [c15]", "B：訊號 RMS 0.212 V，用 $\\dfrac{P_{signal}}{P_{noise}}$ 直接算 → 55.9 dB [c16]", "對照：61.9 − 6.02 = 6.02×9 + 1.76，訊號少半 [c48]", "0.6 / 1.17m = 512 → 等效 9 bits [c17]"], "result": "擺幅減半 ⇒ SNR 掉 6.02 dB ⇒ 等於少 1 bit [c18]", "notes": "A 剛好等於 6.02×10 + 1.76，B 等於 6.02×9 + 1.76。"}, {"id": "s7", "layout": "diagram", "kicker": "A · 基本量", "title": "從同一張頻譜讀動態參數", "svg": "<svg viewBox='0 0 600 400' xmlns='http://www.w3.org/2000/svg' font-family='Noto Sans TC,Noto Sans CJK TC,Microsoft JhengHei,sans-serif'><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1d2433'/><\/marker><\/defs><line x1='40' y1='330' x2='580' y2='330' stroke='#1d2433' stroke-width='1.5' marker-end='url(#ah)'/><line x1='40' y1='330' x2='40' y2='40' stroke='#1d2433' stroke-width='1.5' marker-end='url(#ah)'/><text x='575' y='355' font-size='15' text-anchor='end' fill='#4a5468'>頻率 → Nyquist<\/text><text x='48' y='52' font-size='15' fill='#4a5468'>dB<\/text><path d='M45,300 L45,292 L54,295 L63,298 L72,301 L81,304 L90,307 L99,293 L108,296 L117,299 L126,302 L135,305 L144,308 L153,294 L162,297 L171,300 L180,303 L189,306 L198,292 L207,295 L216,298 L225,301 L234,304 L243,307 L252,293 L261,296 L270,299 L279,302 L288,305 L297,308 L306,294 L315,297 L324,300 L333,303 L342,306 L351,292 L360,295 L369,298 L378,301 L387,304 L396,307 L405,293 L414,296 L423,299 L432,302 L441,305 L450,308 L459,294 L468,297 L477,300 L486,303 L495,306 L504,292 L513,295 L522,298 L531,301 L540,304 L549,307 L558,293 L567,296' fill='none' stroke='#8a93a6' stroke-width='1.2'/><line x1='150' y1='300' x2='150' y2='70' stroke='#2f6f8f' stroke-width='4'/><text x='150' y='62' font-size='16' text-anchor='middle' fill='#2f6f8f'>訊號<\/text><line x1='300' y1='300' x2='300' y2='210' stroke='#c2413b' stroke-width='4'/><text x='300' y='202' font-size='16' text-anchor='middle' fill='#c2413b'>諧波<\/text><line x1='450' y1='300' x2='450' y2='235' stroke='#c2413b' stroke-width='4'/><text x='450' y='227' font-size='16' text-anchor='middle' fill='#c2413b'>諧波<\/text><line x1='380' y1='300' x2='380' y2='190' stroke='#d9622b' stroke-width='4'/><text x='380' y='182' font-size='16' text-anchor='middle' fill='#d9622b'>最大 spur<\/text><line x1='110' y1='70' x2='110' y2='190' stroke='#d9622b' stroke-width='2' marker-end='url(#ah)'/><text x='104' y='135' font-size='16' text-anchor='end' fill='#d9622b'>SFDR<\/text><line x1='110' y1='70' x2='150' y2='70' stroke='#d9622b' stroke-dasharray='3 3'/><line x1='110' y1='190' x2='380' y2='190' stroke='#d9622b' stroke-dasharray='3 3'/><text x='165' y='278' font-size='15' fill='#4a5468'>雜訊地板（SNR 看它）<\/text><text x='590' y='392' font-size='13' text-anchor='end' fill='#8a93a6'>示意圖（自己畫）<\/text><\/svg>", "bullets": ["$\\mathrm{SNR}=10\\log_{10}\\dfrac{P_{signal}}{P_{noise}}$ [c20]", "$\\mathrm{THD}=10\\log_{10}\\dfrac{P_{harmonics}}{P_{signal}}$ [c21]", "$\\mathrm{SFDR}=10\\log_{10}\\dfrac{P_{signal}}{P_{max\\_spur}}$（dBc）[c22]", "$\\mathrm{SNDR}=10\\log_{10}\\dfrac{P_{signal}}{P_{noise}+P_{harmonics}}$ [c23]", "$\\mathrm{ENOB}=\\dfrac{\\mathrm{SNDR}-1.76}{6.02}$ [c24]"], "notes": "動機：靜態參數看不出高頻表現，所以要用正弦輸入看 FFT。"}, {"id": "s8", "layout": "calc", "kicker": "A · 基本量", "title": "驗算 Liu 2010 的 ENOB 與 FoM", "given": ["SNDR 57.0 dB、0.826 mW、50 MS/s [c26]", "$\\mathrm{FOM}=\\dfrac{\\mathrm{Power}}{2^{\\mathrm{ENOB}}\\times\\min\\{2\\times\\mathrm{ERBW},f_s\\}}$ [c25]"], "steps": ["ENOB = (57.0 − 1.76)/6.02 = 9.18 bits [c27]", "$2^{9.18}\\approx 580$ [c28]", "0.826 mW / (580 × 50 MHz) ≈ 28.5 fJ [c28]"], "result": "≈ 論文寫的 FoM 29 fJ/conversion-step [c26]", "notes": "自己算一次就知道 FoM 的每個數字從哪來。"}, {"id": "s9", "layout": "causal", "kicker": "A · 基本量", "title": "靜態參數：INL 為什麼在中間跳", "figure": "liu2010-fig14", "chain": [{"tag": "動機", "items": ["電容失配讓某些碼特別寬或窄，要量 DNL/INL [c30]"]}, {"tag": "問題", "items": ["INL 在 0111111111 → 1000000000 跳 [c31]"]}, {"tag": "原因", "items": ["佈線寄生讓 MSB 電容大約 1 LSB；中間碼正是 MSB 翻轉 [c32]"]}, {"tag": "代價", "items": ["效能主要受這個固定的電容失配限制 [c33]"]}], "notes": "每顆晶片都有 → 不是隨機，是佈線。"}]}, "cards": {"c1": {"page": "mixed-signal/basic/sampling-aliasing", "title": "取樣與混疊（Sampling, Aliasing）", "sources": ["percy-ms-notes"], "text": "動機：ADC 只能處理離散時間的值，所以要先取樣。(src: percy-ms-notes)"}, "c2": {"page": "mixed-signal/basic/sampling-aliasing", "title": "取樣與混疊（Sampling, Aliasing）", "sources": ["percy-ms-notes"], "text": "問題：取樣會把頻譜每隔 fs 複製一次，頻率 m·fs + Δf 和 Δf 取樣後變成同一個序列。(src: percy-ms-notes)"}, "c3": {"page": "mixed-signal/basic/sampling-aliasing", "title": "取樣與混疊（Sampling, Aliasing）", "sources": ["percy-ms-notes"], "text": "結論：輸入頻寬必須限制在 fs/2 以內，否則高頻會折回低頻（推論，依 Nyquist）。"}, "c4": {"page": "mixed-signal/basic/sampling-aliasing", "title": "取樣與混疊（Sampling, Aliasing）", "sources": ["percy-ms-notes"], "text": "頻域：$X_s(f) = \\frac{1}{T_s}\\sum_{k=-\\infty}^{\\infty} X(f-kf_s)$，把原頻譜每隔 fs 複製一次。(src: percy-ms-notes)"}, "c5": {"page": "mixed-signal/basic/sampling-aliasing", "title": "取樣與混疊（Sampling, Aliasing）", "sources": ["percy-ms-notes"], "text": "混疊推導：$x[n] = \\cos\\!\\left(2\\pi\\frac{mf_s+\\Delta f}{f_s}n\\right) = \\cos(2\\pi mn \\pm 2\\pi\\frac{\\Delta f}{f_s}n) = \\cos\\!\\left(2\\pi\\frac{\\Delta f}{f_s}n\\right)$ (src: percy-ms-notes)"}, "c6": {"page": "mixed-signal/basic/sampling-aliasing", "title": "取樣與混疊（Sampling, Aliasing）", "sources": ["percy-ms-notes"], "text": "2πmn 是 2π 的整數倍，所以可以消掉。(src: percy-ms-notes)"}, "c8": {"page": "mixed-signal/basic/quantization-noise-snr", "title": "量化雜訊與 SNR（Quantization Noise, SNR = 6.02N + 1.76）", "sources": ["percy-ms-notes"], "text": "動機：要知道一顆 N 位元 ADC 理論上最好能多乾淨。(src: percy-ms-notes)"}, "c9": {"page": "mixed-signal/basic/quantization-noise-snr", "title": "量化雜訊與 SNR（Quantization Noise, SNR = 6.02N + 1.76）", "sources": ["percy-ms-notes"], "text": "問題：量化誤差在 ±½Q 之間，是實務上一定存在的雜訊。(src: percy-ms-notes)"}, "c10": {"page": "mixed-signal/basic/quantization-noise-snr", "title": "量化雜訊與 SNR（Quantization Noise, SNR = 6.02N + 1.76）", "sources": ["percy-ms-notes"], "text": "結果：SNR = 6.02 × N + 1.76 是理想最大值，不考慮其它 non-ideal。(src: percy-ms-notes)"}, "c11": {"page": "mixed-signal/basic/quantization-noise-snr", "title": "量化雜訊與 SNR（Quantization Noise, SNR = 6.02N + 1.76）", "sources": ["percy-ms-notes"], "text": "代價／陷阱：訊號沒滿 code 時，訊號↓、相對雜訊↑、SNR↓。(src: percy-ms-notes)"}, "c12": {"page": "mixed-signal/basic/quantization-noise-snr", "title": "量化雜訊與 SNR（Quantization Noise, SNR = 6.02N + 1.76）", "sources": ["percy-ms-notes"], "text": "量化雜訊 RMS = LSB/√12 (src: percy-ms-notes)"}, "c13": {"page": "mixed-signal/basic/quantization-noise-snr", "title": "量化雜訊與 SNR（Quantization Noise, SNR = 6.02N + 1.76）", "sources": ["percy-ms-notes"], "text": "算例條件：10 bits、VDD = 1.2 V；A：Vsig 0~1.2 V；B：Vsig 0.3~0.9 V (src: percy-ms-notes)"}, "c14": {"page": "mixed-signal/basic/quantization-noise-snr", "title": "量化雜訊與 SNR（Quantization Noise, SNR = 6.02N + 1.76）", "sources": ["percy-ms-notes"], "text": "LSB = 1.2/1024 = 1.17 mV；量化雜訊 RMS = LSB/√12 = 0.34 mV (src: percy-ms-notes)"}, "c15": {"page": "mixed-signal/basic/quantization-noise-snr", "title": "量化雜訊與 SNR（Quantization Noise, SNR = 6.02N + 1.76）", "sources": ["percy-ms-notes"], "text": "A：振幅 0.6 V、訊號 RMS 0.424 V；SNR = 0.424 / (0.34×10⁻³) = 1247 = 61.9 dB = 6.02×10 + 1.76 (src: percy-ms-notes)"}, "c16": {"page": "mixed-signal/basic/quantization-noise-snr", "title": "量化雜訊與 SNR（Quantization Noise, SNR = 6.02N + 1.76）", "sources": ["percy-ms-notes"], "text": "B：振幅 0.3 V、訊號 RMS 0.212 V；用 ② SNR = P_signal / P_noise 直接算出 55.9 dB (src: percy-ms-notes)"}, "c17": {"page": "mixed-signal/basic/quantization-noise-snr", "title": "量化雜訊與 SNR（Quantization Noise, SNR = 6.02N + 1.76）", "sources": ["percy-ms-notes"], "text": "0.6 / 1.17m = 512 → 等效 9 bits ADC (src: percy-ms-notes)"}, "c18": {"page": "mixed-signal/basic/quantization-noise-snr", "title": "量化雜訊與 SNR（Quantization Noise, SNR = 6.02N + 1.76）", "sources": ["percy-ms-notes"], "text": "擺幅減半 ⇒ SNR 掉 6.02 dB ⇒ 等於少 1 bit：這是「訊號沒滿 code」最直觀的代價。(src: percy-ms-notes)"}, "c20": {"page": "mixed-signal/basic/adc-dynamic-parameters", "title": "ADC 動態參數（SNR、THD、SFDR、SNDR、ENOB、dBc/dBFS、FoM）", "sources": ["percy-meeting1"], "text": "$\\mathrm{SNR(dB)} = 10\\log_{10}\\frac{P_{signal}}{P_{noise}}$ (src: percy-meeting1)"}, "c21": {"page": "mixed-signal/basic/adc-dynamic-parameters", "title": "ADC 動態參數（SNR、THD、SFDR、SNDR、ENOB、dBc/dBFS、FoM）", "sources": ["percy-meeting1"], "text": "$\\mathrm{THD(dB)} = 10\\log_{10}\\frac{P_{harmonics}}{P_{signal}}$ (src: percy-meeting1)"}, "c22": {"page": "mixed-signal/basic/adc-dynamic-parameters", "title": "ADC 動態參數（SNR、THD、SFDR、SNDR、ENOB、dBc/dBFS、FoM）", "sources": ["percy-meeting1"], "text": "$\\mathrm{SFDR(dBc)} = 10\\log_{10}\\frac{P_{signal}}{P_{max\\_spur}}$ (src: percy-meeting1)"}, "c23": {"page": "mixed-signal/basic/adc-dynamic-parameters", "title": "ADC 動態參數（SNR、THD、SFDR、SNDR、ENOB、dBc/dBFS、FoM）", "sources": ["percy-meeting1"], "text": "$\\mathrm{SNDR(dB)} = 10\\log_{10}\\frac{P_{signal}}{P_{noise}+P_{harmonics}}$ (src: percy-meeting1)"}, "c24": {"page": "mixed-signal/basic/adc-dynamic-parameters", "title": "ADC 動態參數（SNR、THD、SFDR、SNDR、ENOB、dBc/dBFS、FoM）", "sources": ["percy-meeting1"], "text": "$\\mathrm{ENOB(bits)} = \\frac{\\mathrm{SNDR}-1.76}{6.02}$ (src: percy-meeting1)"}, "c25": {"page": "mixed-signal/basic/adc-dynamic-parameters", "title": "ADC 動態參數（SNR、THD、SFDR、SNDR、ENOB、dBc/dBFS、FoM）", "sources": ["percy-meeting1"], "text": "$\\mathrm{FOM} = \\frac{\\mathrm{Power}}{2^{\\mathrm{ENOB}}\\times \\min\\{2\\times \\mathrm{ERBW},\\, f_s\\}}$ (src: percy-meeting1)"}, "c26": {"page": "mixed-signal/basic/adc-dynamic-parameters", "title": "ADC 動態參數（SNR、THD、SFDR、SNDR、ENOB、dBc/dBFS、FoM）", "sources": ["liu-2010-monotonic"], "text": "Liu 2010 實測：低頻 SNDR 57.0 dB、ENOB 9.18 bits、FoM 29 fJ/conversion-step、50 MS/s、0.826 mW (src: liu-2010-monotonic)"}, "c27": {"page": "mixed-signal/basic/adc-dynamic-parameters", "title": "ADC 動態參數（SNR、THD、SFDR、SNDR、ENOB、dBc/dBFS、FoM）", "sources": ["自己算（docs/calc-check.py）"], "text": "驗算 ENOB：(57.0 − 1.76)/6.02 = 9.18 bits（計算）"}, "c28": {"page": "mixed-signal/basic/adc-dynamic-parameters", "title": "ADC 動態參數（SNR、THD、SFDR、SNDR、ENOB、dBc/dBFS、FoM）", "sources": ["自己算（docs/calc-check.py）"], "text": "驗算 FoM：2^9.18 ≈ 580；0.826 mW / (580 × 50 MHz) ≈ 28.5 fJ，四捨五入就是論文的 29 fJ（計算）"}, "c30": {"page": "mixed-signal/basic/adc-static-parameters", "title": "ADC 靜態參數（LSB、DNL、INL、Gain/Offset Error）", "sources": ["percy-meeting1"], "text": "動機：電容失配會讓某些碼特別寬或特別窄，要量出來。(src: percy-meeting1)"}, "c31": {"page": "mixed-signal/basic/adc-static-parameters", "title": "ADC 靜態參數（LSB、DNL、INL、Gain/Offset Error）", "sources": ["percy-meeting1"], "text": "問題：Liu 的晶片 INL 在中間碼 0111111111 → 1000000000 跳動。(src: percy-meeting1)"}, "c32": {"page": "mixed-signal/basic/adc-static-parameters", "title": "ADC 靜態參數（LSB、DNL、INL、Gain/Offset Error）", "sources": ["liu-2010-monotonic"], "text": "原因：佈線寄生讓 MSB 電容大了約 1 LSB；中間碼正是 MSB 翻轉的位置。(src: liu-2010-monotonic)"}, "c33": {"page": "mixed-signal/basic/adc-static-parameters", "title": "ADC 靜態參數（LSB、DNL、INL、Gain/Offset Error）", "sources": ["liu-2010-monotonic"], "text": "代價：效能主要受這個固定的電容失配限制。(src: liu-2010-monotonic)"}, "c34": {"page": "mixed-signal/basic/adc-architectures", "title": "各種 ADC 架構（Flash、Two-step、Pipeline、Integrating、Time-interleaved、SAR）", "sources": ["percy-meeting1"], "text": "動機：Flash 最快、最簡單，把輸入同時和很多個 Vref 比較，直接給出數位輸出。(src: percy-meeting1)"}, "c35": {"page": "mixed-signal/basic/adc-architectures", "title": "各種 ADC 架構（Flash、Two-step、Pipeline、Integrating、Time-interleaved、SAR）", "sources": ["percy-meeting1"], "text": "問題：Flash 要 2^n − 1 個比較器，耗電，高解析度時很複雜。(src: percy-meeting1)"}, "c36": {"page": "mixed-signal/basic/adc-architectures", "title": "各種 ADC 架構（Flash、Two-step、Pipeline、Integrating、Time-interleaved、SAR）", "sources": ["percy-meeting1"], "text": "解法 1（分段）：Two-step 先用 Coarse ADC 決定高位元，把殘值放大後再用 Fine ADC 決定低位元。(src: percy-meeting1)"}, "c37": {"page": "mixed-signal/basic/adc-architectures", "title": "各種 ADC 架構（Flash、Two-step、Pipeline、Integrating、Time-interleaved、SAR）", "sources": ["percy-meeting1"], "text": "解法 2（再多分幾段）：Pipeline 每一級做 ADC → DAC → 相減，把殘值傳給下一級；每級 3 bits，合起來 3n bits。(src: percy-meeting1)"}, "c38": {"page": "mixed-signal/basic/adc-architectures", "title": "各種 ADC 架構（Flash、Two-step、Pipeline、Integrating、Time-interleaved、SAR）", "sources": ["razavi-2015"], "text": "代價：pipeline 需要 op-amp 放大殘值，op-amp 的增益和線性度會限制效能。(src: razavi-2015)"}, "c39": {"page": "mixed-signal/basic/adc-architectures", "title": "各種 ADC 架構（Flash、Two-step、Pipeline、Integrating、Time-interleaved、SAR）", "sources": ["percy-meeting1", "razavi-2015"], "text": "解法 3（一次 1 bit）：SAR 只用一個比較器重複 N 次，中速時效率好、低功耗。(src: percy-meeting1, razavi-2015)"}, "c40": {"page": "mixed-signal/basic/adc-architectures", "title": "各種 ADC 架構（Flash、Two-step、Pipeline、Integrating、Time-interleaved、SAR）", "sources": ["percy-meeting1"], "text": "解法 4（用時間換精度）：Integrating 先用輸入對電容充電固定時間 T1，再用參考電壓放電，數放電時間。(src: percy-meeting1)"}, "c41": {"page": "mixed-signal/basic/adc-architectures", "title": "各種 ADC 架構（Flash、Two-step、Pipeline、Integrating、Time-interleaved、SAR）", "sources": ["percy-meeting1"], "text": "解法 5（並排換速度）：Time-interleaved 讓多個通道輪流取樣，單一通道來不及，就多顆並排錯開時間。(src: percy-meeting1)"}, "c42": {"page": "mixed-signal/basic/adc-architectures", "title": "各種 ADC 架構（Flash、Two-step、Pipeline、Integrating、Time-interleaved、SAR）", "sources": ["percy-meeting1"], "text": "Two-step 例子：4-bit Flash ADC（15 個碼階）對照 ideal 2-step（2-2）ADC：先決定 2 個 MSB，再對殘值決定 2 個 LSB (src: percy-meeting1)"}, "c43": {"page": "mixed-signal/basic/adc-architectures", "title": "各種 ADC 架構（Flash、Two-step、Pipeline、Integrating、Time-interleaved、SAR）", "sources": ["自己算（docs/calc-check.py）"], "text": "以 4 位元為例：Flash 要 2^4 − 1 = 15 個比較器；2-2 two-step 每段只要 2^2 − 1 = 3 個，兩段共 6 個（計算）"}, "c44": {"page": "mixed-signal/basic/adc-architectures", "title": "各種 ADC 架構（Flash、Two-step、Pipeline、Integrating、Time-interleaved、SAR）", "sources": ["saxena-lecture"], "text": "交錯的極端例子：8 位元 56 GS/s 用了 320 個 175 MS/s 的 SAR 通道 (src: saxena-lecture)"}, "c45": {"page": "mixed-signal/basic/adc-architectures", "title": "各種 ADC 架構（Flash、Two-step、Pipeline、Integrating、Time-interleaved、SAR）", "sources": ["percy-meeting1"], "text": "SAR + Time-interleaved：多顆 SAR ADC 共用時脈，各自寫進 RAM，再輪流讀出到 OUT。(src: percy-meeting1)"}, "c46": {"page": "mixed-signal/basic/adc-architectures", "title": "各種 ADC 架構（Flash、Two-step、Pipeline、Integrating、Time-interleaved、SAR）", "sources": ["percy-meeting1", "razavi-2015"], "text": "「SAR 的缺點」在 meeting 報告裡只寫「滿多的，但算是 limitation」(src: percy-meeting1)；具體是：一個 bit 一個週期所以速度有限，比較器雜訊直接限制解析度。(src: razavi-2015)"}, "c47": {"page": "mixed-signal/basic/adc-architectures", "title": "各種 ADC 架構（Flash、Two-step、Pipeline、Integrating、Time-interleaved、SAR）", "sources": ["percy-meeting1"], "text": "Two-step：Coarse ADC 先轉出 D_coarse → DAC 轉回類比 → 和 Vin 相減 → 放大 G → Fine ADC 轉出 D_fine → 兩段合成 D_out。(src: percy-meeting1)"}, "c48": {"page": "mixed-signal/basic/quantization-noise-snr", "title": "量化雜訊與 SNR（Quantization Noise, SNR = 6.02N + 1.76）", "sources": ["percy-ms-notes"], "text": "B 旁註：61.9 − 6.02 = 6.02×9 + 1.76，訊號少半 (src: percy-ms-notes)"}}, "figures": {"liu2010-fig14": {"src": "../../../../assets/figures/liu2010-fig14.png", "label": "Fig. 14", "desc": "量測 DNL / INL，INL 在中間碼有跳動", "cite": "Chun-Cheng Liu et al., IEEE JSSC, vol. 45, no. 4, pp. 731–740, April 2010"}}};
(function(){
  const deck = DATA.deck, cards = DATA.cards, figures = DATA.figures || {}, stage = document.getElementById('stage');
  function paper(id){
    const f = figures[id]; if (!f) return '';
    return `<figure class="paper"><div class="imgwrap"><img src="${f.src}" alt="${esc(f.label)}"></div>
      <figcaption><b>${esc(f.label)}</b>　${esc(f.desc)}<span class="src">圖源：${esc(f.cite)}，© 原出版者，僅供教學引用</span></figcaption></figure>`;
  }
  const wikiBase = deck.wiki_base || '../../wiki/';
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const CITE = /\[(c\d+(?:\s*,\s*c\d+)*)\]/g;
  function rich(t, used){
    return esc(t).replace(CITE, (_, ids) => ids.split(',').map(s => s.trim()).map(id => {
      used.add(id); return `<span class="cite" data-card="${id}">${id}</span>`;
    }).join(''));
  }
  function list2(items, used){ return `<ul>${(items||[]).map(t => `<li>${rich(t, used)}</li>`).join('')}</ul>`; }
  function list(items, used){ return `<ul class="pts">${(items||[]).map(t => `<li>${rich(t, used)}</li>`).join('')}</ul>`; }
  function head(s){
    const k = s.kicker ? `<div class="kicker">${esc(s.kicker)}</div>` : '';
    const en = s.en ? `<span class="en">${esc(s.en)}</span>` : '';
    return `${k}<h1 class="title">${esc(s.title)}${en}</h1>`;
  }
  function refs(used){
    return [...used].sort((a,b)=>+a.slice(1)-+b.slice(1)).map(id => {
      const c = cards[id]; if(!c) return '';
      return `<a class="ref" data-card="${id}" href="${wikiBase}${c.page}.md" target="_blank"><b>${id}</b> ${esc(c.page.split('/').pop())} ← ${esc(c.sources.join(', '))}</a>`;
    }).join('');
  }
  const slides = deck.slides.map((s, i) => {
    const used = new Set(); let inner = '';
    const L = s.layout || 'bullets';
    if (L === 'title') {
      inner = `<div class="bar"></div>${s.kicker?`<div class="kicker">${esc(s.kicker)}</div>`:''}<h1>${esc(s.title)}</h1>
        ${s.subtitle?`<div class="sub">${esc(s.subtitle)}</div>`:''}<div class="meta">${esc(deck.author||'')}${deck.date?' · '+esc(deck.date):''}</div>`;
    } else if (L === 'two-col') {
      inner = head(s) + `<div class="body"><div class="col"><h3>${esc(s.left_title||'')}</h3>${list(s.left, used)}</div>
        <div class="col"><h3>${esc(s.right_title||'')}</h3>${list(s.right, used)}</div></div>`;
    } else if (L === 'diagram') {
      const visual = s.figure ? paper(s.figure) : `<div class="fig">${s.svg||''}</div>`;
      inner = head(s) + `<div class="body"><div class="col" style="flex:.85">${list(s.bullets, used)}</div>${visual}</div>`;
    } else if (L === 'causal') {
      const TAG = {'動機':'t-motive','問題':'t-problem','為什麼':'t-why','解法':'t-solution','代價':'t-cost','優缺點':'t-cost','結果':'t-solution','原因':'t-why'};
      const visual = s.figure ? paper(s.figure) : (s.svg ? `<div class="fig">${s.svg}</div>` : '');
      const chain = `<div class="chain ${visual ? 'v' : 'h'}">${(s.chain||[]).map(c => `<div class="step ${TAG[c.tag]||'t-why'}"><div class="tag">${esc(c.tag)}</div>${list2(c.items, used)}</div>`).join('')}</div>`;
      inner = head(s) + (visual ? `<div class="body"><div class="col" style="flex:1.05">${chain}</div>${visual}</div>` : `<div class="body">${chain}</div>`);
    } else if (L === 'calc') {
      inner = head(s) + `<div class="calc"><div class="given"><h3>條件</h3><ul>${(s.given||[]).map(g=>`<li>${rich(g, used)}</li>`).join('')}</ul></div>
        <div class="steps"><h3>步驟</h3><ol>${(s.steps||[]).map(g=>`<li>${rich(g, used)}</li>`).join('')}</ol>${s.result?`<div class="result">${rich(s.result, used)}</div>`:''}</div></div>`;
    } else if (L === 'quiz') {
      inner = head(s) + `<div class="q">${esc(s.question)}</div><div class="opts">${s.options.map((o,j)=>`<button class="opt" data-j="${j}">${String.fromCharCode(65+j)}. ${esc(o)}</button>`).join('')}</div>
        <div class="explain">${rich(s.explain||'', used)}</div>`;
    } else {
      inner = head(s) + `<div class="body"><div class="col">${list(s.bullets, used)}</div></div>`;
    }
    const el = document.createElement('section');
    el.className = `slide l-${L}`; el.dataset.i = i;
    el.innerHTML = inner + `<div class="footer"><div class="refs">${refs(used)}</div><div class="pageno">${i+1} / ${deck.slides.length}</div></div>`;
    if (L === 'quiz') el.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      el.querySelectorAll('.opt').forEach(x => x.classList.add(+x.dataset.j === s.answer ? 'right' : (x === b ? 'wrong' : 'z')));
      el.querySelector('.explain').classList.add('show');
    });
    stage.appendChild(el); return el;
  });
  // navigation
  let cur = Math.min(Math.max((parseInt(location.hash.slice(1))||1)-1, 0), slides.length-1);
  const notes = document.getElementById('notes');
  function show(i){
    cur = Math.max(0, Math.min(slides.length-1, i));
    slides.forEach((s,j) => s.classList.toggle('active', j===cur));
    document.getElementById('progress').style.width = ((cur+1)/slides.length*100)+'%';
    history.replaceState(null,'','#'+(cur+1));
    notes.innerHTML = '<b>講稿 '+(cur+1)+'：</b>'+esc(deck.slides[cur].notes||'（無）');
  }
  function fit(){
    if (document.body.classList.contains('overview')) return;
    const k = Math.min(innerWidth/1280, innerHeight/720) * .96;
    stage.style.transform = `scale(${k})`;
  }
  addEventListener('resize', fit);
  addEventListener('keydown', e => {
    if (['ArrowRight','PageDown',' ','Enter'].includes(e.key)) { show(cur+1); e.preventDefault(); }
    else if (['ArrowLeft','PageUp','Backspace'].includes(e.key)) { show(cur-1); e.preventDefault(); }
    else if (e.key==='Home') show(0); else if (e.key==='End') show(slides.length-1);
    else if (e.key==='n'||e.key==='N') notes.classList.toggle('show');
    else if (e.key==='o'||e.key==='O') { document.body.classList.toggle('overview'); fit(); if(!document.body.classList.contains('overview')) fit(); }
    else if (e.key==='p'||e.key==='P') print();
  });
  stage.addEventListener('click', e => {
    if (document.body.classList.contains('overview')) {
      const s = e.target.closest('.slide'); if (s) { document.body.classList.remove('overview'); show(+s.dataset.i); fit(); }
      return;
    }
    if (e.target.closest('button,a,.cite')) return;
    show(e.clientX > innerWidth/3 ? cur+1 : cur-1);
  });
  let tx = null;
  addEventListener('touchstart', e => tx = e.touches[0].clientX, {passive:true});
  addEventListener('touchend', e => { if (tx===null) return; const d = e.changedTouches[0].clientX - tx; if (Math.abs(d)>40) show(cur + (d<0?1:-1)); tx=null; });
  // citation tooltip: 顯示 wiki 原文證據
  const tip = document.getElementById('tip');
  document.addEventListener('mouseover', e => {
    const t = e.target.closest('[data-card]'); if (!t) return;
    const c = cards[t.dataset.card]; if (!c) return;
    tip.innerHTML = `<small>${t.dataset.card} · wiki/${esc(c.page)}</small>${esc(c.text)}`;
    tip.style.display = 'block';
  });
  document.addEventListener('mousemove', e => { tip.style.left = Math.min(e.clientX+14, innerWidth-480)+'px'; tip.style.top = Math.max(e.clientY-14-tip.offsetHeight, 8)+'px'; });
  document.addEventListener('mouseout', e => { if (e.target.closest('[data-card]')) tip.style.display = 'none'; });
  if (deck.home) document.getElementById('home').href = deck.home;
  addEventListener('keydown', e => { if (e.key === 'h' || e.key === 'H') location.href = document.getElementById('home').href; });
  fit(); show(cur);
  // LaTeX：$…$ 行內、$$…$$ 置中（KaTeX，檔案在 template/vendor/katex，離線可用）
  addEventListener('load', () => { if (window.renderMathInElement) renderMathInElement(stage, {
    delimiters: [{left:'$$', right:'$$', display:true}, {left:'$', right:'$', display:false}], throwOnError:false }); });
})();
</script>
</body>
</html>
