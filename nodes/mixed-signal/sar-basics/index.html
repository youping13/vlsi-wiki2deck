<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAR 通論 · VLSI</title>
<!-- wiki2deck 大目錄：由 pipeline/wiki2deck.py hub 依 taxonomy.json 產生，請勿手改 -->
<style>
:root{--ink:#1d2433;--ink-2:#4a5468;--muted:#8a93a6;--paper:#fbfaf7;--line:#e6e2d8;--accent:#d9622b;--accent-2:#2f6f8f;--ok:#2f8f5b;--bad:#c2413b;
  --sans:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;--mono:"JetBrains Mono","Cascadia Code",Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans)}
a{color:inherit}
header{background:radial-gradient(1000px 420px at 85% 120%,#36506a 0%,#1d2433 60%);color:#fff;padding:48px 24px 76px}
.wrap{max-width:1120px;margin:0 auto}
.k{color:#f3a37a;font-weight:700;letter-spacing:.18em;font-size:13px}
h1{font-size:46px;margin:8px 0 10px;font-weight:800}
header p{color:#c9d3e3;font-size:17px;line-height:1.7;max-width:760px}
/* 第一層：大分類 */
.top{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:-44px;position:relative}
.top a{display:block;background:#fff;border:1px solid var(--line);border-top:5px solid var(--c);border-radius:12px;padding:14px 16px;text-decoration:none;box-shadow:0 6px 18px rgba(29,36,51,.08)}
.top a:hover{transform:translateY(-2px)}
.top b{display:block;font-size:19px}
.top span{font-size:13px;color:var(--ink-2)}


section.l1{margin-top:44px;scroll-margin-top:16px}
section.l1>h2{font-size:28px;display:flex;align-items:baseline;gap:12px;border-bottom:3px solid var(--c);padding-bottom:8px}
section.l1>h2 small{font-size:15px;color:var(--ink-2);font-weight:400}
.empty-box{margin-top:14px;border:2px dashed #d6d2c8;border-radius:14px;padding:22px;color:var(--muted);font-size:15px}
/* 因果鏈 */
.chain{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 6px}
.chain a{flex:1 1 150px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:10px 12px;text-decoration:none;font-size:14.5px;line-height:1.5;position:relative}
.chain a:hover{border-color:var(--c)}
.chain a .n{display:block;font-family:var(--mono);font-size:11.5px;color:var(--c);font-weight:700;margin-bottom:2px}
.chain-t{font-size:13px;color:var(--muted);letter-spacing:.12em;margin-top:18px}
/* 第二層以下：節點 */
.node{margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.node>h3{font-size:22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.node>h3 .path{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:400}
.node>.desc{color:var(--ink-2);font-size:15px;line-height:1.65;margin:6px 0 4px}
.tag{font-size:12px;border-radius:6px;padding:2px 8px;color:#fff;background:var(--c);font-weight:700}
.tag.paper{background:#b8962e}
.blk{margin-top:16px}
.blk>h4{font-size:13px;letter-spacing:.14em;color:var(--muted);margin-bottom:8px}
.deck{border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:1fr 1.25fr;gap:18px;margin-bottom:10px;background:var(--paper)}
.deck h5{font-size:18px;margin-bottom:4px}
.deck .sum{color:var(--ink-2);font-size:14px;line-height:1.6}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--ink-2);background:#fff}
.chip.ok{border-color:#bfe2cd;color:var(--ok);background:#eef8f2}.chip.bad{border-color:#f3c6c3;color:var(--bad);background:#fdf0ef}
.go{display:inline-block;background:var(--c);color:#fff;text-decoration:none;padding:7px 14px;border-radius:9px;font-weight:700;font-size:14px}
ol.sl{list-style:none;display:flex;flex-direction:column;gap:2px}
ol.sl a{display:flex;gap:8px;align-items:baseline;text-decoration:none;padding:4px 8px;border-radius:7px;font-size:14px;line-height:1.4}
ol.sl a:hover{background:#fff}
ol.sl .no{font-family:var(--mono);color:var(--muted);font-size:11.5px;min-width:18px}
ol.sl .ty{font-size:11px;border-radius:5px;padding:1px 6px;white-space:nowrap;color:#fff;background:var(--t)}
.src{display:block;text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;background:#fff}
.src:hover{border-color:var(--c)}
.src b{font-size:15px;display:block;margin-bottom:3px}
.src span{font-size:13.5px;color:var(--ink-2);line-height:1.55;display:block}
.cons{display:flex;flex-wrap:wrap;gap:8px}
.cons a{text-decoration:none;font-size:13.5px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:#fff}
.cons a:hover{border-color:var(--c)}
.node .node{background:var(--paper)}
footer{margin:52px 0 40px;padding-top:22px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px}
footer a{text-decoration:none;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-size:14.5px}
.note{color:var(--muted);font-size:13px;margin-top:14px;width:100%}
@media (max-width:820px){.deck{grid-template-columns:1fr}h1{font-size:36px}}

header.small{padding:28px 24px 64px}
header.small h1{font-size:36px}
.crumbs{font-size:13.5px;color:#c9d3e3;margin-bottom:6px}
.crumbs a{color:#f3a37a;text-decoration:none}.crumbs a:hover{text-decoration:underline}
.card{display:flex;flex-direction:column;gap:8px;background:#fff;border:1px solid var(--line);border-top:5px solid var(--c);border-radius:14px;padding:16px 18px;text-decoration:none;box-shadow:0 6px 18px rgba(29,36,51,.08);transition:transform .15s}
.card:hover{transform:translateY(-2px);border-color:var(--c)}
.card b.t{font-size:21px}
.card .d{font-size:13.5px;color:var(--ink-2);line-height:1.55}
.card .cnt{font-size:12.5px;color:var(--c);font-weight:700;font-family:var(--mono)}
.card ul{list-style:none;display:flex;flex-direction:column;gap:3px;border-top:1px dashed var(--line);padding-top:8px}
.card li{font-size:13.5px;color:var(--ink-2)}
.card li::before{content:"▸ ";color:var(--c)}
.card li.e{color:var(--muted)}.card li.e::before{content:"○ ";color:var(--muted)}
.card.empty{border-top-color:#d6d2c8;background:#f6f4ef;box-shadow:none}
.card .d,.card .cnt{display:block}
.card.empty .d{color:var(--muted)}
.card.empty b.t{color:var(--muted)}
h2.sec{font-size:15px;letter-spacing:.14em;color:var(--muted);margin:36px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
details.more{margin-top:12px}
details.more summary{cursor:pointer;font-size:14px;color:var(--ink-2)}
</style>
</head>
<body>
<header id="hd"><div class="wrap"><div class="crumbs" id="crumbs"></div><div class="k">VLSI-WIKI2DECK</div><h1 id="t"></h1><p id="intro"></p></div></header>
<main class="wrap" id="main"></main>
<main class="wrap"><footer id="links"></footer></main>
<script>
const HUB = {"node": {"id": "sar-basics", "path": "mixed-signal/sar-basics", "title": "SAR 通論", "desc": "SAR 架構本身：二元搜尋、電容 DAC、比較器、速度、冗餘、SAR vs Pipeline；每篇參考資料都有單獨的論述", "kind": "", "decks": [], "sources": [{"title": "A Hybrid Energy-Efficient, Area-Efficient, Low-Complexity Switching Scheme in SAR ADC for Biosensor Applications", "href": "https://github.com/youping13/vlsi-wiki2deck/blob/main/wiki/mixed-signal/sar-basics/sources/hu-2024-hybrid.md", "lead": "monotonic 之後的切換方式，大多是「monotonic＋電容分割」的變形。"}, {"title": "MT-021 Tutorial — ADC Architectures II: Successive Approximation ADCs", "href": "https://github.com/youping13/vlsi-wiki2deck/blob/main/wiki/mixed-signal/sar-basics/sources/kester-mt021.md", "lead": "SAR = 比較器＋DAC＋邏輯組成的回授迴路，精度主要由內部 DAC 決定。"}, {"title": "A Tale of Two ADCs: Pipelined Versus SAR", "href": "https://github.com/youping13/vlsi-wiki2deck/blob/main/wiki/mixed-signal/sar-basics/sources/razavi-2015.md", "lead": "SAR 贏在不需要 op-amp、沒有靜態功耗；輸在比較器雜訊和串列的速度。"}, {"title": "Successive Approximation ADCs (lecture slides)", "href": "https://github.com/youping13/vlsi-wiki2deck/blob/main/wiki/mixed-signal/sar-basics/sources/saxena-lecture.md", "lead": "電容比例就是砝碼比例，VX 的正負就是答案。"}, {"title": "Low-Power SAR ADC Design: Overview and Survey of State-of-the-Art Techniques", "href": "https://github.com/youping13/vlsi-wiki2deck/blob/main/wiki/mixed-signal/sar-basics/sources/tang-2022-survey.md", "lead": "核心 SAR 已接近極限，下一步是 noise-shaping、pipelined-SAR 這類混合架構。"}], "concepts": [{"title": "二元搜尋演算法（Binary Search）與秤重比喻", "href": "https://github.com/youping13/vlsi-wiki2deck/blob/main/wiki/mixed-signal/sar-basics/binary-search.md"}, {"title": "電容 DAC 與電荷重分配（Capacitive DAC, Charge Redistribution）", "href": "https://github.com/youping13/vlsi-wiki2deck/blob/main/wiki/mixed-signal/sar-basics/cdac-charge-redistribution.md"}, {"title": "比較器（Comparator）", "href": "https://github.com/youping13/vlsi-wiki2deck/blob/main/wiki/mixed-signal/sar-basics/comparator.md"}, {"title": "轉換速度與時序（Conversion Speed, Async SAR）", "href": "https://github.com/youping13/vlsi-wiki2deck/blob/main/wiki/mixed-signal/sar-basics/conversion-speed.md"}, {"title": "SAR ADC 簡史（History）", "href": "https://github.com/youping13/vlsi-wiki2deck/blob/main/wiki/mixed-signal/sar-basics/history.md"}, {"title": "雜訊與電容尺寸（kT/C Noise, Matching）", "href": "https://github.com/youping13/vlsi-wiki2deck/blob/main/wiki/mixed-signal/sar-basics/noise-and-sizing.md"}, {"title": "冗餘與校正（Redundancy, Calibration）", "href": "https://github.com/youping13/vlsi-wiki2deck/blob/main/wiki/mixed-signal/sar-basics/redundancy-and-calibration.md"}, {"title": "SAR ADC 總覽（Successive Approximation Register ADC）", "href": "https://github.com/youping13/vlsi-wiki2deck/blob/main/wiki/mixed-signal/sar-basics/sar-adc-overview.md"}, {"title": "SAR 與 Pipeline ADC 比較（SAR vs. Pipelined）", "href": "https://github.com/youping13/vlsi-wiki2deck/blob/main/wiki/mixed-signal/sar-basics/sar-vs-pipeline.md"}], "chain": [], "children": [], "total": 14}, "crumbs": [{"title": "VLSI", "path": ""}, {"title": "Mixed-Signal", "path": "mixed-signal"}], "rel": "../../../", "root": false, "links": [{"text": "📚 Wiki 首頁", "href": "https://github.com/youping13/vlsi-wiki2deck/blob/main/wiki/index.md"}, {"text": "🗺 Roadmap", "href": "https://github.com/youping13/vlsi-wiki2deck/blob/main/docs/roadmap.md"}], "generated": "2026-11-22 23:24"};
(function(){
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  const R = HUB.rel || '';
  const L = h => /^https?:/.test(h) ? h : R + h;              // 樹裡的路徑都是相對根目錄
  const nodeHref = path => path ? R + 'nodes/' + path + '/index.html' : R + 'index.html';
  const COL = ['#2f6f8f','#d9622b','#8b5cf6','#2f8f5b','#c2413b','#b8962e'];
  const TY = {causal:['因果','#8b5cf6'], calc:['計算','#2f6f8f'], diagram:['圖','#2f8f5b'], quiz:['測驗','#d9622b'], bullets:['重點','#8a93a6'], summary:['總結','#8a93a6'], title:['封面','#b5b0a5']};
  const N = HUB.node;
  const all = (n, k) => n[k].length + n.children.reduce((a, c) => a + all(c, k), 0);
  const count = n => [all(n,'decks') && `${all(n,'decks')} 份簡報`, all(n,'sources') && `${all(n,'sources')} 篇論述`, all(n,'concepts') && `${all(n,'concepts')} 個概念`].filter(Boolean).join(' · ');

  document.title = document.title;
  document.getElementById('t').textContent = N.title;
  document.getElementById('intro').textContent = N.desc;
  if (!HUB.root) {
    document.getElementById('hd').classList.add('small');
    document.getElementById('crumbs').innerHTML = HUB.crumbs.map(c => `<a href="${nodeHref(c.path)}">${esc(c.title)}</a>`).join(' › ') + ' ›';
  }
  // 分類卡：只放標題、一句話、數量、裡面有什麼（點進去才看細節）
  function card(n, i){
    const c = COL[i % COL.length];
    if (!n.total) return `<a class="card empty" href="${nodeHref(n.path)}" style="--c:${c}"><b class="t">${esc(n.title)}</b><span class="d">${esc(n.desc)}</span><span class="cnt">待新增</span></a>`;
    const items = n.children.length
      ? n.children.map(ch => `<li class="${ch.total?'':'e'}">${esc(ch.title)}${ch.total?'':'（待新增）'}</li>`).join('')
      : n.decks.map(d => `<li>${esc(d.title)}</li>`).join('');
    return `<a class="card" href="${nodeHref(n.path)}" style="--c:${c}"><b class="t">${esc(n.title)}${n.kind==='paper'?' <span class="tag paper">論文</span>':''}</b>
      <span class="d">${esc(n.desc)}</span><span class="cnt">${count(n)}</span>${items?`<ul>${items}</ul>`:''}</a>`;
  }
  function deckCard(d){
    return `<div class="deck" style="--c:var(--accent)"><div><h5>${esc(d.title)}</h5><div class="sum">${esc(d.summary)}</div>
      <div class="meta"><span class="chip">${d.slides.length} 頁</span>${d.skeleton?`<span class="chip">骨架：${esc(d.skeleton)}</span>`:''}
      <span class="chip ${d.status==='PASS'?'ok':'bad'}">關卡 ${esc(d.status)}</span></div>
      <a class="go" href="${L(d.href)}">開始 ▶</a></div>
      <ol class="sl">${d.slides.map((s,i)=>{const t=TY[s.layout]||['頁','#8a93a6'];
        return `<li><a href="${L(d.href)}#${i+1}"><span class="no">${i+1}</span><span class="ty" style="--t:${t[1]}">${t[0]}</span><span>${esc(s.title)}</span></a></li>`;}).join('')}</ol></div>`;
  }
  let h = '';
  if (HUB.root) {
    h = `<nav class="top">${N.children.map(card).join('')}</nav>`;
  } else {
    if (N.chain.length) h += `<h2 class="sec">因果鏈（點了直接跳到那一頁）</h2><div class="chain" style="--c:var(--accent-2)">${N.chain.map((c,i)=>
      `<a href="${L(c.href)}"><span class="n">${i+1} · ${esc(c.node.split('/').pop())}</span>${esc(c.text)}</a>`).join('')}</div>`;
    if (N.children.length) h += `<h2 class="sec">子分類</h2><div class="grid">${N.children.map(card).join('')}</div>`;
    if (N.decks.length) h += `<h2 class="sec">簡報</h2>${N.decks.map(deckCard).join('')}`;
    if (N.sources.length) h += `<h2 class="sec">每篇來源的論述</h2>${N.sources.map(s=>`<a class="src" href="${esc(s.href)}"><b>${esc(s.title)}</b><span>${md(s.lead)}</span></a>`).join('')}`;
    if (N.concepts.length) h += `<h2 class="sec">概念頁（wiki）</h2><div class="cons">${N.concepts.map(c=>`<a href="${esc(c.href)}">${esc(c.title)}</a>`).join('')}</div>`;
    if (!N.total) h += `<div class="empty-box" style="margin-top:24px">待新增。新增前先決定要放哪個子分類。</div>`;
  }
  document.getElementById('main').innerHTML = h;
  // 從簡報回來時回到原本捲到的位置
  const KEY = 'hub-scroll:' + location.pathname;
  try { const y = sessionStorage.getItem(KEY); if (y) requestAnimationFrame(() => scrollTo(0, +y)); } catch(_){}
  addEventListener('pagehide', () => { try { sessionStorage.setItem(KEY, scrollY); } catch(_){} });
  document.getElementById('links').innerHTML = HUB.links.map(l=>`<a href="${esc(l.href)}">${esc(l.text)}</a>`).join('') +
    `<div class="note">產生時間 ${esc(HUB.generated)} · 由 pipeline/wiki2deck.py hub 依 taxonomy.json 自動產生</div>`;
})();
</script>
</body>
