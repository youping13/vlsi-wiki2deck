<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__HUB_TITLE__</title>
<!-- wiki2deck 大目錄：由 pipeline/wiki2deck.py hub 依 taxonomy.json 產生，請勿手改 -->
<style>
:root{--ink:#1d2433;--ink-2:#4a5468;--muted:#8a93a6;--paper:#fbfaf7;--line:#e6e2d8;--accent:#d9622b;--accent-2:#2f6f8f;--ok:#2f8f5b;--bad:#c2413b;
  --sans:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;--mono:"JetBrains Mono","Cascadia Code",Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans)}
a{color:inherit}
header{background:radial-gradient(1000px 420px at 85% 120%,#36506a 0%,#1d2433 60%);color:#fff;padding:48px 24px 76px}
.wrap{max-width:1120px;margin:0 auto}
.k{color:#f3a37a;font-weight:700;letter-spacing:.18em;font-size:13px}
h1{font-size:46px;margin:8px 0 10px;font-weight:800}
header p{color:#c9d3e3;font-size:17px;line-height:1.7;max-width:760px}
/* 第一層：大分類 */
.top{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:-44px;position:relative}
.top a{display:block;background:#fff;border:1px solid var(--line);border-top:5px solid var(--c);border-radius:12px;padding:14px 16px;text-decoration:none;box-shadow:0 6px 18px rgba(29,36,51,.08)}
.top a:hover{transform:translateY(-2px)}
.top b{display:block;font-size:19px}
.top span{font-size:13px;color:var(--ink-2)}
.top a.empty{border-top-color:#d6d2c8;opacity:.75}
.top a.empty b{color:var(--muted)}
section.l1{margin-top:44px;scroll-margin-top:16px}
section.l1>h2{font-size:28px;display:flex;align-items:baseline;gap:12px;border-bottom:3px solid var(--c);padding-bottom:8px}
section.l1>h2 small{font-size:15px;color:var(--ink-2);font-weight:400}
.empty-box{margin-top:14px;border:2px dashed #d6d2c8;border-radius:14px;padding:22px;color:var(--muted);font-size:15px}
/* 因果鏈 */
.chain{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 6px}
.chain a{flex:1 1 150px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:10px 12px;text-decoration:none;font-size:14.5px;line-height:1.5;position:relative}
.chain a:hover{border-color:var(--c)}
.chain a .n{display:block;font-family:var(--mono);font-size:11.5px;color:var(--c);font-weight:700;margin-bottom:2px}
.chain-t{font-size:13px;color:var(--muted);letter-spacing:.12em;margin-top:18px}
/* 第二層以下：節點 */
.node{margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.node>h3{font-size:22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.node>h3 .path{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:400}
.node>.desc{color:var(--ink-2);font-size:15px;line-height:1.65;margin:6px 0 4px}
.tag{font-size:12px;border-radius:6px;padding:2px 8px;color:#fff;background:var(--c);font-weight:700}
.tag.paper{background:#b8962e}
.blk{margin-top:16px}
.blk>h4{font-size:13px;letter-spacing:.14em;color:var(--muted);margin-bottom:8px}
.deck{border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:1fr 1.25fr;gap:18px;margin-bottom:10px;background:var(--paper)}
.deck h5{font-size:18px;margin-bottom:4px}
.deck .sum{color:var(--ink-2);font-size:14px;line-height:1.6}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--ink-2);background:#fff}
.chip.ok{border-color:#bfe2cd;color:var(--ok);background:#eef8f2}.chip.bad{border-color:#f3c6c3;color:var(--bad);background:#fdf0ef}
.go{display:inline-block;background:var(--c);color:#fff;text-decoration:none;padding:7px 14px;border-radius:9px;font-weight:700;font-size:14px}
ol.sl{list-style:none;display:flex;flex-direction:column;gap:2px}
ol.sl a{display:flex;gap:8px;align-items:baseline;text-decoration:none;padding:4px 8px;border-radius:7px;font-size:14px;line-height:1.4}
ol.sl a:hover{background:#fff}
ol.sl .no{font-family:var(--mono);color:var(--muted);font-size:11.5px;min-width:18px}
ol.sl .ty{font-size:11px;border-radius:5px;padding:1px 6px;white-space:nowrap;color:#fff;background:var(--t)}
.src{display:block;text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;background:#fff}
.src:hover{border-color:var(--c)}
.src b{font-size:15px;display:block;margin-bottom:3px}
.src span{font-size:13.5px;color:var(--ink-2);line-height:1.55;display:block}
.cons{display:flex;flex-wrap:wrap;gap:8px}
.cons a{text-decoration:none;font-size:13.5px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:#fff}
.cons a:hover{border-color:var(--c)}
.node .node{background:var(--paper)}
footer{margin:52px 0 40px;padding-top:22px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px}
footer a{text-decoration:none;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-size:14.5px}
.note{color:var(--muted);font-size:13px;margin-top:14px;width:100%}
@media (max-width:820px){.deck{grid-template-columns:1fr}h1{font-size:36px}}
</style>
</head>
<body>
<header><div class="wrap"><div class="k">VLSI-WIKI2DECK · 大目錄</div><h1 id="t"></h1><p id="intro"></p></div></header>
<main class="wrap">
  <nav class="top" id="top"></nav>
  <div id="body"></div>
  <footer id="links"></footer>
</main>
<script>
const HUB = /*__HUB_DATA__*/null;
(function(){
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  const COL = ['#8a93a6','#2f6f8f','#d9622b','#8b5cf6','#2f8f5b','#c2413b'];
  const TY = {causal:['因果','#8b5cf6'], calc:['計算','#2f6f8f'], diagram:['圖','#2f8f5b'], quiz:['測驗','#d9622b'], bullets:['重點','#8a93a6'], summary:['總結','#8a93a6'], title:['封面','#b5b0a5']};
  const T = HUB.tree;
  document.getElementById('t').textContent = T.title;
  document.getElementById('intro').textContent = T.desc;

  function deckCard(d){
    return `<div class="deck"><div><h5>${esc(d.title)}</h5><div class="sum">${esc(d.summary)}</div>
      <div class="meta"><span class="chip">${d.slides.length} 頁</span>${d.skeleton?`<span class="chip">骨架：${esc(d.skeleton)}</span>`:''}
      <span class="chip ${d.status==='PASS'?'ok':'bad'}">關卡 ${esc(d.status)}</span></div>
      <a class="go" href="${esc(d.href)}">開始 ▶</a></div>
      <ol class="sl">${d.slides.map((s,i)=>{const t=TY[s.layout]||['頁','#8a93a6'];
        return `<li><a href="${esc(d.href)}#${i+1}"><span class="no">${i+1}</span><span class="ty" style="--t:${t[1]}">${t[0]}</span><span>${esc(s.title)}</span></a></li>`;}).join('')}</ol></div>`;
  }
  function chainRow(n){
    if (!n.chain.length) return '';
    return `<div class="chain-t">因果鏈（點了直接跳到那一頁）</div><div class="chain">${n.chain.map((c,i)=>
      `<a href="${esc(c.href)}"><span class="n">${i+1} · ${esc(c.node.split('/').pop())}</span>${esc(c.text)}</a>`).join('')}</div>`;
  }
  function nodeBox(n){
    if (!n.total) return `<div class="node"><h3>${esc(n.title)} <span class="path">${esc(n.path)}</span></h3><div class="desc">${esc(n.desc)}</div><div class="empty-box">待新增</div></div>`;
    return `<div class="node"><h3>${esc(n.title)}${n.kind==='paper'?' <span class="tag paper">論文</span>':''} <span class="path">${esc(n.path)}</span></h3>
      <div class="desc">${esc(n.desc)}</div>${chainRow(n)}
      ${n.decks.length?`<div class="blk"><h4>簡報</h4>${n.decks.map(deckCard).join('')}</div>`:''}
      ${n.sources.length?`<div class="blk"><h4>每篇來源的論述</h4>${n.sources.map(s=>`<a class="src" href="${esc(s.href)}"><b>${esc(s.title)}</b><span>${md(s.lead)}</span></a>`).join('')}</div>`:''}
      ${n.concepts.length?`<div class="blk"><h4>概念頁（wiki）</h4><div class="cons">${n.concepts.map(c=>`<a href="${esc(c.href)}">${esc(c.title)}</a>`).join('')}</div></div>`:''}
      ${n.children.map(nodeBox).join('')}</div>`;
  }
  document.getElementById('top').innerHTML = T.children.map((n,i)=>
    `<a href="#${esc(n.id)}" class="${n.total?'':'empty'}" style="--c:${COL[(i+1)%COL.length]}"><b>${esc(n.title)}</b><span>${n.total?`${n.children.length} 個子分類 · ${n.total} 項`:'待新增'}</span></a>`).join('');
  document.getElementById('body').innerHTML = T.children.map((n,i)=>{
    const c = COL[(i+1)%COL.length];
    const inner = !n.total ? `<div class="empty-box">待新增：${esc(n.desc)}。新增前先決定要放哪個子分類。</div>`
      : chainRow(n) + (n.decks.length?`<div class="blk">${n.decks.map(deckCard).join('')}</div>`:'') + n.children.map(nodeBox).join('');
    return `<section class="l1" id="${esc(n.id)}" style="--c:${c}"><h2>${esc(n.title)} <small>${esc(n.desc)}</small></h2>${inner}</section>`;
  }).join('');
  document.getElementById('links').innerHTML = HUB.links.map(l=>`<a href="${esc(l.href)}">${esc(l.text)}</a>`).join('') +
    `<div class="note">產生時間 ${esc(HUB.generated)} · 由 pipeline/wiki2deck.py hub 依 taxonomy.json 自動產生</div>`;
})();
</script>
</body>
</html>
